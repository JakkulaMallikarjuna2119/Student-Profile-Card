<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            width: 350px;
            height: 400px;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            
            box-shadow: 
                12px 12px 25px 4px rgba(30, 58, 138, 0.25),
                -8px -8px 20px 2px rgba(56, 189, 248, 0.35),
                0px 4px 10px 0px rgba(0, 0, 0, 0.1);
                
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background-color: #1e3a8a;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 18px;
            /* Shadow applied to avatar with offset, blur, spread, and color */
            box-shadow: 0px 6px 15px 3px rgba(30, 58, 138, 0.4);
        }

        .profile-card h2 {
            font-family: 'Georgia', serif;
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            word-spacing: 3px;
            margin: 0 0 8px 0;
        }

        .role {
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #0284c7;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .profile-card p {
            font-family: 'Verdana', sans-serif;
            font-size: 13px;
            font-style: italic;
            color: #475569;
            text-align: justify;
            letter-spacing: 0.5px;
            word-spacing: 2px;
            line-height: 1.7;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">JMR</div>
        <h2>Jakkula Mallikarjuna Rao</h2>
        <div class="role">B.Tech Graduate | Full Stack Developer</div>
        <p>
            A dedicated and passionate computer science student focused on building modern web applications, solving complex problems, and continuously learning new software technologies.
        </p>
        <h3>Skills</h3>
        <div class="role">Python  | Java  | SQL  |  HTML/CSS</div>
    </div>

</body>
</html>
